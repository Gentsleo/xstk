name: Tự Động Cập Nhật Kỳ Quay Vietlott 5/35

on:
  schedule:
    # Vietlott Lotto 5/35 mở thưởng 2 kỳ/ngày.
    # Chạy tự động lúc 11:45 UTC (18:45 VN) và 13:45 UTC (20:45 VN) mỗi ngày
    - cron: '45 11,13 * * *'
    # Chạy thêm một lần vào buổi sáng 01:00 UTC (08:00 VN) để đảm bảo đồng bộ
    - cron: '0 1 * * *'
  workflow_dispatch: # Cho phép người dùng bấm nút "Run workflow" thủ công bất cứ lúc nào

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Run Auto Update
        run: |
          python auto_update.py
          python generate_web_app.py

      - name: Commit and push if new draws found
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Không có kỳ quay mới nào từ Vietlott."
          else
            echo "Phát hiện kỳ quay mới! Đang commit và push..."
            git commit -m "chore(auto-update): cập nhật kết quả kỳ quay mới từ Vietlott [skip ci]"
            git push origin main
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
