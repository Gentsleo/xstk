name: Tự Động Cập Nhật Kỳ Quay Vietlott 5/35

on:
  workflow_dispatch: # Cho phép người dùng chạy thử thủ công nếu cần
  schedule:
    # Sau giờ mở thưởng 13h và 21h hàng ngày (giờ VN = UTC+7):
    # 13:15, 13:30, 13:45 VN -> 06:15, 06:30, 06:45 UTC
    # 21:15, 21:30, 21:45 VN -> 14:15, 14:30, 14:45 UTC
    - cron: '15,30,45 6,14 * * *'
    # Dự phòng trễ 14:00 và 22:00 VN -> 07:00 và 15:00 UTC
    - cron: '0 7,15 * * *'
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Run Auto Update
        run: |
          python auto_update.py || true
          python generate_web_app.py

      - name: Commit and push if new draws found
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Không phát hiện kỳ quay mới từ Vietlott (Lưu ý: Cloudflare WAF chặn IP runner nước ngoài)."
          else
            echo "Phát hiện kỳ quay mới! Đang commit và push..."
            git commit -m "chore(auto-update): cập nhật kết quả kỳ quay mới từ Vietlott [skip ci]"
            git push origin main
          fi
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
