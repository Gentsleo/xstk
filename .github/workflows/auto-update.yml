name: Tự Động Cập Nhật Kỳ Quay Vietlott 5/35

on:
  push:
    paths:
      - '.github/workflows/auto-update.yml'
  schedule:
    # Vietlott Lotto 5/35 mở thưởng 2 kỳ/ngày.
    # Chạy tự động lúc 11:45 UTC (18:45 VN) và 13:45 UTC (20:45 VN) mỗi ngày
    - cron: '45 11,13 * * *'
    # Chạy thêm một lần vào buổi sáng 01:00 UTC (08:00 VN) để đảm bảo đồng bộ
    - cron: '0 1 * * *'
  workflow_dispatch: # Cho phép người dùng bấm nút "Run workflow" thủ công bất cứ lúc nào

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Test and Debug Vietlott Connection
        run: |
          echo "### 🌐 Kiểm tra kết nối từ GitHub Runner tới Vietlott" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          curl -sI -m 10 "https://vietlott.vn/vi/trung-thuong/ket-qua-trung-thuong/winning-number-535" | head -n 15 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import urllib.request
          try:
              req = urllib.request.Request('https://vietlott.vn/vi/trung-thuong/ket-qua-trung-thuong/winning-number-535', headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'})
              r = urllib.request.urlopen(req, timeout=10)
              html = r.read().decode('utf-8')
              print('Status:', r.status, 'HTML len:', len(html), 'ServerSideDrawResult found:', 'ServerSideDrawResult' in html)
          except Exception as e:
              print('ERROR connecting to Vietlott:', type(e).__name__, str(e))
          " >> $GITHUB_STEP_SUMMARY 2>&1 || true
          
          # Ghi vào docs/ci_debug.txt để deploy ra GitHub Pages kiểm tra
          cp $GITHUB_STEP_SUMMARY docs/ci_debug.txt

      - name: Run Auto Update
        run: |
          python auto_update.py
          python generate_web_app.py
          if [ -f auto_update.log ]; then
            echo "### 📋 auto_update.log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 20 auto_update.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 20 auto_update.log >> docs/ci_debug.txt
          fi
      - name: Commit and push if new draws found
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Không có kỳ quay mới nào từ Vietlott."
          else
            echo "Phát hiện kỳ quay mới! Đang commit và push..."
            git commit -m "chore(auto-update): cập nhật kết quả kỳ quay mới từ Vietlott [skip ci]"
            git push origin main
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
